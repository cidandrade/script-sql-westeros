<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Script SQL de Westeros</title>
<meta name="description" content="Construção passo a passo de um script MySQL com duas tabelas relacionadas (casas e personagens de Game of Thrones) — Modelagem de Banco de Dados, Prof. Cid Andrade.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --creme2: #F3ECDF;
  --creme: #FAF6EC;
  --tinta: #241B2E;
  --tinta-suave: #6E6577;
  --ameixa: #3B2350;
  --ameixa2: #2E1B3F;
  --ameixa-suave: #7C6289;
  --verde: #234F33;
  --verde2: #1B3E28;
  --verde-suave: #7FA089;
  --dourado: #B08D57;
  --dourado-claro: #C9A56E;
  --dourado-escuro: #755C33;
  --borda: rgba(59, 35, 80, .16);
  --sombra: 0 1px 2px rgba(36, 27, 46, .06), 0 6px 18px rgba(36, 27, 46, .07);
  --serif: "Fraunces", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --nav-h: 68px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--creme2);
  color: var(--tinta);
  font: 16px/1.6 var(--sans);
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--dourado); outline-offset: 2px; border-radius: 6px; }

/* ---------- topo ---------- */
.topo {
  position: sticky; top: 0; z-index: 20;
  background: var(--ameixa);
  color: var(--creme);
  border-bottom: 3px solid var(--dourado);
}
.topo-int {
  max-width: 1180px; margin: 0 auto;
  padding: 10px 16px;
  display: flex; align-items: center; gap: 12px;
}
.marca { flex: 1; min-width: 0; }
.marca small {
  display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dourado-claro); font-weight: 600;
}
.marca strong {
  display: block; font: 600 18px/1.2 var(--serif);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn-indice {
  background: transparent; border: 1px solid rgba(250, 246, 236, .35);
  color: var(--creme); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
}
.progresso { height: 4px; background: var(--ameixa2); }
.progresso span { display: block; height: 100%; width: 0; background: var(--dourado); transition: width .3s; }

main {
  max-width: 1180px; margin: 0 auto;
  padding: 20px 16px calc(var(--nav-h) + 32px);
}

/* ---------- capa ---------- */
.capa h1 {
  font: 700 clamp(30px, 8vw, 52px)/1.08 var(--serif);
  margin: 8px 0 12px; color: var(--ameixa); letter-spacing: -.01em;
}
.capa h1 em { color: var(--verde); font-style: italic; font-weight: 600; }
.lead { font-size: 18px; color: var(--tinta); max-width: 62ch; margin: 0 0 20px; }
.rotulo {
  display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dourado-escuro);
}
.cartao {
  background: var(--creme); border: 1px solid var(--borda); border-radius: 14px;
  padding: 18px 16px; box-shadow: var(--sombra); margin-bottom: 16px;
}
.cartao h2 { font: 600 22px/1.25 var(--serif); margin: 4px 0 10px; color: var(--ameixa); }
.cartao h3 { font: 600 17px/1.3 var(--serif); margin: 14px 0 6px; color: var(--ameixa); }
.cartao p { margin: 0 0 10px; }
.cartao ul { margin: 0 0 6px; padding-left: 20px; }
.cartao li { margin-bottom: 6px; }
.req { list-style: none; padding: 0 !important; }
.req li {
  display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
  padding: 10px 0; border-top: 1px dashed var(--borda); margin: 0 !important;
}
.req li:first-child { border-top: 0; }
.selo {
  font: 700 12px/1 var(--mono); padding: 5px 8px; border-radius: 6px;
  background: var(--ameixa); color: var(--creme); white-space: nowrap; margin-top: 2px;
}
.selo.kpi { background: var(--verde); }

.der-caixa { overflow-x: auto; background: var(--creme2); border-radius: 10px; padding: 12px; border: 1px solid var(--borda); }
.der-caixa .mermaid { min-width: 300px; text-align: center; }
.der-caixa svg { max-width: 100%; height: auto; }
.der-falha { font: 13px/1.5 var(--mono); white-space: pre; margin: 0; }
details { margin-top: 12px; }
summary { cursor: pointer; font-weight: 600; color: var(--ameixa); }
details pre { margin: 10px 0 0; }

.cardinalidade { display: grid; gap: 10px; margin-top: 12px; }
.cardinalidade div {
  display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: center;
  font-size: 15px;
}
.cardinalidade code {
  font: 700 15px var(--mono); color: var(--ameixa); background: var(--creme2);
  border-radius: 6px; padding: 4px 0; text-align: center;
}

.btn-iniciar {
  width: 100%; border: 0; border-radius: 12px; padding: 16px 20px;
  background: var(--verde); color: var(--creme);
  font: 700 18px/1 var(--sans); letter-spacing: .02em;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 4px 0 var(--verde2);
  transition: transform .08s, box-shadow .08s;
}
.btn-iniciar:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--verde2); }
.btn-iniciar span { color: var(--dourado-claro); }

/* ---------- passo ---------- */
.passo-cab { margin-bottom: 16px; }
.fase {
  display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--dourado-escuro);
}
.fase b {
  background: var(--dourado); color: var(--tinta); border-radius: 999px; padding: 3px 9px; letter-spacing: .06em;
}
.passo-cab h1 {
  font: 700 clamp(26px, 6.5vw, 40px)/1.12 var(--serif); color: var(--ameixa);
  margin: 8px 0 10px; letter-spacing: -.01em;
}
.passo-cab p { margin: 0; font-size: 17px; max-width: 70ch; }

.grade { display: grid; gap: 16px; }
.coluna { min-width: 0; }

.bloco-titulo {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: 0 0 8px;
}
.bloco-titulo h2 { font: 600 13px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); margin: 0; }

.codigo {
  position: relative; background: var(--tinta); color: var(--creme);
  border-radius: 12px; overflow: hidden; box-shadow: var(--sombra);
  border-top: 3px solid var(--dourado);
}
.codigo pre { margin: 0; padding: 14px 0; overflow-x: auto; font: 14px/1.65 var(--mono); }
.codigo .ln { display: block; padding: 0 16px; min-height: 1.65em; white-space: pre; border-left: 3px solid transparent; transition: background .2s; }
.codigo .ln.acesa { background: rgba(201, 165, 110, .16); border-left-color: var(--dourado-claro); }
.tk-kw { color: var(--dourado-claro); font-weight: 700; }
.tk-fn { color: var(--dourado-claro); }
.tk-str { color: var(--verde-suave); }
.tk-num { color: var(--verde-suave); }
.tk-com { color: rgba(250, 246, 236, .72); font-style: italic; }
.tk-pont { color: rgba(250, 246, 236, .8); }

.btn-copiar {
  border: 1px solid var(--borda); background: var(--creme); color: var(--ameixa);
  border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 600;
}

.resultado {
  border-radius: 12px; overflow: hidden; border: 1px solid var(--borda); background: var(--creme);
  box-shadow: var(--sombra);
}
.terminal {
  margin: 0; padding: 12px 16px; background: var(--ameixa2); color: var(--creme);
  font: 13.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word;
}
.terminal .ok { color: var(--verde-suave); font-weight: 700; }
.terminal .err { color: var(--dourado-claro); font-weight: 700; }
.terminal .dim { color: rgba(250, 246, 236, .7); }
.erro-faixa {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px;
  background: var(--dourado); color: var(--tinta); font-weight: 700; font-size: 14px;
}

.tabela-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--borda); }
th { font: 700 12px/1.2 var(--mono); color: var(--ameixa); background: var(--creme2); letter-spacing: .02em; }
td.num { font-family: var(--mono); text-align: right; }
td.nulo { color: var(--tinta-suave); font: italic 13px var(--mono); }
tr.nova td { background: rgba(127, 160, 137, .2); }
td.mudou { background: rgba(201, 165, 110, .32); font-weight: 700; }
td.mudou s { color: var(--tinta-suave); font-weight: 400; margin-right: 6px; }
tr.removida td { text-decoration: line-through; color: var(--tinta-suave); background: rgba(110, 101, 119, .1); }
.rodape-res {
  padding: 8px 16px; font: 13px var(--mono); color: var(--tinta-suave); background: var(--creme);
}
.legenda { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 16px; font-size: 13px; color: var(--tinta-suave); }
.legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

.partes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.parte {
  background: var(--creme); border: 1px solid var(--borda); border-radius: 12px; padding: 12px 14px;
  cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.parte:hover { border-color: var(--ameixa-suave); }
.parte.ativa { border-color: var(--dourado); box-shadow: 0 0 0 2px rgba(176, 141, 87, .35); }
.parte code.trecho {
  display: inline-block; font: 700 13.5px/1.4 var(--mono); color: var(--ameixa);
  background: var(--creme2); border-radius: 6px; padding: 3px 7px; margin-bottom: 6px;
  white-space: pre-wrap; word-break: break-word;
}
.parte p { margin: 0; font-size: 15.5px; }
code { font-family: var(--mono); font-size: .9em; background: rgba(59, 35, 80, .08); padding: 1px 5px; border-radius: 4px; }
.parte code.trecho + p code, .nota code { background: rgba(59, 35, 80, .08); }

.nota {
  border-left: 4px solid var(--dourado); background: var(--creme); border-radius: 0 12px 12px 0;
  padding: 12px 14px; margin-top: 12px; font-size: 15.5px;
}
.nota strong.tipo { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dourado-escuro); margin-bottom: 4px; }
.nota.verde { border-left-color: var(--verde); }
.nota.verde strong.tipo { color: var(--verde); }
.nota p { margin: 0 0 6px; }
.nota p:last-child { margin: 0; }

.toque { font-size: 13px; color: var(--tinta-suave); margin: 0 0 10px; }

.secao { margin-top: 22px; }

/* ---------- fim ---------- */
.fim-acoes { display: grid; gap: 10px; margin: 12px 0 16px; }
.btn-sec {
  border: 2px solid var(--ameixa); background: var(--creme); color: var(--ameixa);
  border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 16px;
}
.btn-prim {
  border: 2px solid var(--ameixa); background: var(--ameixa); color: var(--creme);
  border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 16px;
}
.codigo.longo pre { max-height: 60vh; }
.ordem { counter-reset: o; list-style: none; padding: 0 !important; }
.ordem li { counter-increment: o; display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
.ordem li::before {
  content: counter(o); width: 26px; height: 26px; border-radius: 50%; background: var(--dourado);
  color: var(--tinta); font-weight: 700; font-size: 13px; display: grid; place-items: center; margin-top: 1px;
}

/* ---------- navegação ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--creme); border-top: 1px solid var(--borda);
  box-shadow: 0 -4px 16px rgba(36, 27, 46, .08);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-int {
  max-width: 1180px; margin: 0 auto; height: var(--nav-h);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 0 12px;
}
.nav button {
  border: 0; background: transparent; border-radius: 10px; padding: 10px 12px; font-weight: 700; font-size: 15px;
  color: var(--ameixa); min-height: 46px;
}
.nav .ant { justify-self: start; }
.nav .prox { justify-self: end; background: var(--ameixa); color: var(--creme); padding: 10px 18px; }
.nav button:disabled { opacity: .35; cursor: default; }
.contador { font: 600 13px var(--mono); color: var(--tinta-suave); text-align: center; }
.nav[hidden] { display: none; }

/* ---------- índice ---------- */
dialog {
  border: 0; padding: 0; border-radius: 16px; width: min(560px, calc(100vw - 24px)); max-height: 82vh;
  background: var(--creme); color: var(--tinta); box-shadow: 0 20px 60px rgba(36, 27, 46, .35);
}
dialog::backdrop { background: rgba(36, 27, 46, .55); }
.dlg-cab { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--borda); position: sticky; top: 0; background: var(--creme); }
.dlg-cab h2 { font: 600 20px var(--serif); margin: 0; color: var(--ameixa); }
.dlg-cab button { border: 0; background: var(--creme2); border-radius: 8px; padding: 6px 12px; font-weight: 700; }
.lista-passos { list-style: none; margin: 0; padding: 8px; }
.lista-passos button {
  width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 10px 12px;
  display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: baseline;
}
.lista-passos button:hover { background: var(--creme2); }
.lista-passos button[aria-current="step"] { background: var(--creme2); box-shadow: inset 3px 0 0 var(--dourado); }
.lista-passos .n { font: 700 13px var(--mono); color: var(--dourado-escuro); }
.lista-passos .t { font-weight: 600; }
.lista-passos .f { display: block; font-size: 12px; color: var(--tinta-suave); font-weight: 400; }

.aviso-copia {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 16px); transform: translateX(-50%) translateY(20px);
  background: var(--tinta); color: var(--creme); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30;
}
.aviso-copia.on { opacity: 1; transform: translateX(-50%) translateY(0); }

.entra { animation: entra .28s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .entra { animation: none; } * { transition: none !important; } }

/* ---------- telas maiores ---------- */
@media (min-width: 720px) {
  main { padding-left: 24px; padding-right: 24px; }
  .cartao { padding: 22px 24px; }
  .capa-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .fim-acoes { grid-template-columns: 1fr 1fr; }
  .btn-iniciar { width: auto; padding: 16px 40px; }
}
@media (min-width: 1000px) {
  .grade { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .grade .coluna:first-child { position: sticky; top: 84px; }
  .codigo pre { font-size: 15px; }
}
</style>
</head>
<body>

<header class="topo">
  <div class="topo-int">
    <div class="marca">
      <small>Modelagem de Banco de Dados · MySQL</small>
      <strong>Script SQL passo a passo</strong>
    </div>
    <button class="btn-indice" id="btnIndice" type="button" aria-haspopup="dialog">☰ Passos</button>
  </div>
  <div class="progresso" aria-hidden="true"><span id="barra"></span></div>
</header>

<main id="palco" tabindex="-1"></main>

<nav class="nav" id="nav" hidden aria-label="Navegação entre passos">
  <div class="nav-int">
    <button class="ant" id="btnAnt" type="button">← Anterior</button>
    <div class="contador" id="contador" aria-live="polite"></div>
    <button class="prox" id="btnProx" type="button">Próximo →</button>
  </div>
</nav>

<dialog id="dlg" aria-labelledby="dlgTitulo">
  <div class="dlg-cab">
    <h2 id="dlgTitulo">Passos do script</h2>
    <button type="button" id="dlgFechar">Fechar</button>
  </div>
  <ol class="lista-passos" id="listaPassos"></ol>
</dialog>

<div class="aviso-copia" id="aviso" role="status">Copiado!</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
"use strict";

/* ===================================================================
   Conteúdo
   =================================================================== */

const MERMAID_DER = `erDiagram
    CASA ||--o{ PERSONAGEM : "abriga"
    CASA {
        INT id_casa PK "AUTO_INCREMENT"
        VARCHAR nome UK "50, obrigatório"
        VARCHAR lema "100, obrigatório"
        VARCHAR sede "60, opcional"
    }
    PERSONAGEM {
        INT id_personagem PK "AUTO_INCREMENT"
        VARCHAR nome UK "80, único na casa"
        VARCHAR titulo "80, opcional"
        TINYINT idade "0 a 120, opcional"
        BOOLEAN vivo "padrão TRUE"
        INT id_casa FK,UK "obrigatório"
    }`;

// Estados das tabelas ao longo do script (o que um SELECT * mostraria).
const COL_CASA = ["id_casa", "nome", "lema", "sede"];
const COL_PERS = ["id_personagem", "nome", "titulo", "idade", "vivo", "id_casa"];
const CASAS = [
  [1, "Stark", "O inverno está chegando", "Winterfell"],
  [2, "Lannister", "Ouça-me rugir", "Rochedo Casterly"],
  [3, "Targaryen", "Fogo e Sangue", "Pedra do Dragão"],
  [4, "Greyjoy", "Nós não semeamos", "Pyke"],
];
const PERS = [
  [1, "Eddard Stark", "Senhor de Winterfell", 35, 1, 1],
  [2, "Sansa Stark", null, 13, 1, 1],
  [3, "Arya Stark", null, 11, 1, 1],
  [4, "Tyrion Lannister", "Mão do Rei", 32, 1, 2],
  [5, "Cersei Lannister", "Rainha Regente", 34, 1, 2],
  [6, "Daenerys Targaryen", "Mãe dos Dragões", 16, 1, 3],
  [7, "Theon Greyjoy", "Príncipe de Pyke", 19, 1, 4],
];
const comMudanca = (linhas, i, mudancas) =>
  linhas.map((l, k) => (k === i ? l.map((v, c) => (c in mudancas ? mudancas[c] : v)) : l));
const PERS_NED = comMudanca(PERS, 0, { 4: 0 });
const PERS_SANSA = comMudanca(PERS_NED, 1, { 2: "Rainha do Norte", 3: 20 });

const PASSOS = [
  /* ------------------------------------------------------------ 1 */
  {
    fase: "DDL", rotulo: "Banco de dados",
    titulo: "Recomeçar do zero: DROP e CREATE DATABASE",
    intro: "Todo script de criação começa garantindo um ponto de partida limpo. Assim ele pode ser executado quantas vezes for preciso e sempre produz o mesmo banco.",
    sql: `DROP DATABASE IF EXISTS westeros;

CREATE DATABASE westeros
  CHARACTER SET utf8mb4
  COLLATE utf8mb4_0900_ai_ci;`,
    partes: [
      ["DROP DATABASE", "Apaga o banco <b>inteiro</b>: todas as tabelas, dados, índices e chaves. Não existe desfazer."],
      ["IF EXISTS", "Só tenta apagar se o banco existir. Sem isso, na primeira execução o MySQL devolve <code>ERROR 1008: Can't drop database 'westeros'; database doesn't exist</code> e o script para. Com ele, o script vira <b>reexecutável</b>."],
      ["CREATE DATABASE westeros", "Cria o banco vazio. No MySQL, <code>DATABASE</code> e <code>SCHEMA</code> são sinônimos — o Workbench chama de <i>schema</i>."],
      ["CHARACTER SET utf8mb4", "A codificação dos textos. <code>utf8mb4</code> guarda qualquer caractere Unicode: os acentos de <i>“Ouça-me rugir”</i>, o <i>ç</i>, até emoji. Evite <code>utf8</code>, que no MySQL é um apelido do antigo <code>utf8mb3</code>."],
      ["COLLATE utf8mb4_0900_ai_ci", "A regra para <b>comparar e ordenar</b> textos. <code>ai</code> = <i>accent insensitive</i> e <code>ci</code> = <i>case insensitive</i>: para o banco, <code>'stark'</code>, <code>'Stark'</code> e <code>'STÁRK'</code> são iguais. É o padrão do MySQL 8."],
      [";", "O ponto e vírgula encerra cada comando. Num script com vários comandos, ele é o separador."],
    ],
    resultado: {
      tipo: "msg",
      texto: `mysql> DROP DATABASE IF EXISTS westeros;
<span class="ok">Query OK</span>, 0 rows affected, 1 warning
<span class="dim">-- o aviso (Note 1008) só aparece na 1ª vez: não havia banco para apagar</span>

mysql> CREATE DATABASE westeros ...;
<span class="ok">Query OK</span>, 1 row affected`,
    },
    notas: [

/* ===================================================================
   Utilidades
   =================================================================== */

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const KW = new Set(("DROP DATABASE IF EXISTS CREATE CHARACTER SET COLLATE USE TABLE NOT NULL AUTO_INCREMENT CONSTRAINT " +
  "PRIMARY KEY UNIQUE CHECK FOREIGN REFERENCES ON DELETE UPDATE CASCADE RESTRICT ENGINE INSERT INTO VALUES SELECT AS FROM " +
  "INNER LEFT JOIN ORDER BY GROUP DEFAULT TRUE FALSE BETWEEN AND WHERE").split(" "));
const FN = new Set("INT VARCHAR TINYINT UNSIGNED BOOLEAN COUNT SUM COALESCE CHAR_LENGTH TRIM INNODB".split(" "));

function realcarLinha(linha) {
  const re = /(--.*$)|('(?:[^']|'')*')|(\b\d+\b)|([A-Za-z_][A-Za-z0-9_]*)|([(),;=.*+<>])/g;
  let out = "", ult = 0, m;
  while ((m = re.exec(linha))) {
    out += esc(linha.slice(ult, m.index));
    const [t, com, str, num, pal, pont] = m;
    if (com) out += `<span class="tk-com">${esc(com)}</span>`;
    else if (str) out += `<span class="tk-str">${esc(str)}</span>`;
    else if (num) out += `<span class="tk-num">${num}</span>`;
    else if (pal) {
      const up = pal.toUpperCase();
      if (KW.has(up)) out += `<span class="tk-kw">${pal}</span>`;
      else if (FN.has(up)) out += `<span class="tk-fn">${pal}</span>`;
      else out += esc(pal);
    } else if (pont) out += `<span class="tk-pont">${esc(pont)}</span>`;
    ult = m.index + t.length;
  }
  return out + esc(linha.slice(ult));
}

function blocoCodigo(sql, { longo = false } = {}) {
  const linhas = sql.split("\n").map((l) => `<span class="ln">${realcarLinha(l) || " "}</span>`).join("");
  return `<div class="codigo${longo ? " longo" : ""}"><pre><code>${linhas}</code></pre></div>`;
}

const ehNum = (v) => typeof v === "number";
function celula(v, extra = "") {
  if (v === null) return `<td class="nulo ${extra}">NULL</td>`;
  return `<td class="${ehNum(v) ? "num " : ""}${extra}">${esc(v)}</td>`;
}

function tabelaHTML(colunas, linhas, { novas = [], removidas = [], mudou = {}, antes = null } = {}) {
  const cab = colunas.map((c) => `<th scope="col">${esc(c)}</th>`).join("");
  const corpo = linhas.map((l, i) => {
    const cls = novas.includes(i) ? "nova" : removidas.includes(i) ? "removida" : "";
    const tds = l.map((v, c) => {
      if (mudou[i] && mudou[i].includes(c)) {
        const velho = antes[i][c];
        const tag = velho === null ? "NULL" : esc(velho);
        return `<td class="mudou${ehNum(v) ? " num" : ""}"><s>${tag}</s>${esc(v)}</td>`;
      }
      return celula(v);
    }).join("");
    return `<tr class="${cls}">${tds}</tr>`;
  }).join("");
  return `<div class="tabela-wrap"><table><thead><tr>${cab}</tr></thead><tbody>${corpo}</tbody></table></div>`;
}

function legendaEstado(e) {
  const itens = [];
  if (e.novas) itens.push(`<span><i style="background:rgba(127,160,137,.45)"></i>linha inserida</span>`);
  if (e.mudou) itens.push(`<span><i style="background:rgba(201,165,110,.55)"></i>valor alterado (riscado = antes)</span>`);
  if (e.removidas) itens.push(`<span><i style="background:rgba(110,101,119,.3)"></i>linha excluída</span>`);
  return `<div class="legenda">${itens.join("")}</div>`;
}

function nota([tipo, titulo, html]) {
  return `<div class="nota ${tipo === "verde" ? "verde" : ""}"><strong class="tipo">${esc(titulo)}</strong><p>${html}</p></div>`;
}

let timerAviso;
function avisar(msg) {
  const a = document.getElementById("aviso");
  a.textContent = msg;
  a.classList.add("on");
  clearTimeout(timerAviso);
  timerAviso = setTimeout(() => a.classList.remove("on"), 1600);
}
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); avisar("Copiado!"); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = texto; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); avisar("Copiado!"); } catch { avisar("Não foi possível copiar"); }
    ta.remove();
  }
}

function scriptCompleto() {
  const cab = `-- =============================================================
-- Script: westeros.sql  (MySQL 8)
-- Banco de exemplo: casas e personagens de Game of Thrones
-- Modelagem de Banco de Dados - Prof. Cid Andrade
-- =============================================================
`;
  const blocos = PASSOS.map((p, i) => {
    const titulo = `-- Passo ${i + 1} - ${p.titulo}`;
    let sql = p.sql;
    if (p.script === "comentado") {
      sql = "-- Demonstração: este comando FALHA com ERROR 1451 (a FK protege a casa).\n" +
        sql.split("\n").map((l) => "-- " + l).join("\n");
    }
    return `${titulo}\n${sql}`;
  });
  return cab + "\n" + blocos.join("\n\n") + "\n";
}

function renderDER() {
  const el = document.getElementById("der");
  if (!el) return;
  if (!window.mermaid) {
    el.innerHTML = `<pre class="der-falha">${esc(MERMAID_DER)}</pre>`;
    return;
  }
  el.textContent = MERMAID_DER;
  el.removeAttribute("data-processed");
  mermaid.run({ nodes: [el] }).catch(() => {
    el.innerHTML = `<pre class="der-falha">${esc(MERMAID_DER)}</pre>`;
  });
}

function ir(n, { foco = true } = {}) {
  atual = Math.max(0, Math.min(TOTAL + 1, n));
  if (atual === 0) palco.innerHTML = telaCapa();
  else if (atual <= TOTAL) palco.innerHTML = telaPasso(atual);
  else palco.innerHTML = telaFim();

  nav.hidden = atual === 0;
  document.getElementById("btnAnt").disabled = atual === 0;
  const prox = document.getElementById("btnProx");
  prox.disabled = atual === TOTAL + 1;
  prox.textContent = atual === TOTAL ? "Script completo →" : "Próximo →";
  document.getElementById("contador").textContent =
    atual === 0 ? "" : atual <= TOTAL ? `${atual} / ${TOTAL}` : "fim";
  document.getElementById("barra").style.width = `${(atual / (TOTAL + 1)) * 100}%`;

  const hash = atual === 0 ? "#inicio" : atual <= TOTAL ? `#passo-${atual}` : "#script";
  if (location.hash !== hash) history.replaceState(null, "", hash);

  if (atual === 0) renderDER();
  window.scrollTo(0, 0);
  if (foco) palco.focus({ preventScroll: true });
}

function lerHash() {
  const h = location.hash;
  if (h === "#script") return TOTAL + 1;
  const m = h.match(/^#passo-(\d+)$/);
  return m ? Number(m[1]) : 0;
}

// Destacar no código a(s) linha(s) do trecho tocado.
function destacar(li) {
  const p = PASSOS[atual - 1];
  if (!p) return;
  const [trecho] = p.partes[Number(li.dataset.k)];
  const alvo = trecho.trim();
  const jaAtiva = li.classList.contains("ativa");
  palco.querySelectorAll(".parte.ativa").forEach((x) => x.classList.remove("ativa"));
  const linhas = palco.querySelectorAll(".coluna:first-child .codigo .ln");
  linhas.forEach((x) => x.classList.remove("acesa"));
  if (jaAtiva) return;
  li.classList.add("ativa");
  const fonte = p.sql.split("\n");
  let achou = false;
  fonte.forEach((l, k) => {
    if (alvo.length > 1 && (l.includes(alvo) || (alvo.length > 6 && l.trim() && alvo.includes(l.trim()) && l.trim().length > 3))) {
      linhas[k].classList.add("acesa"); achou = true;
    }
  });
  if (!achou) {
    // trecho curto (ex.: "NULL", ";") — acende as linhas que o contêm
    fonte.forEach((l, k) => { if (alvo && l.includes(alvo)) linhas[k].classList.add("acesa"); });
  }
  const primeira = palco.querySelector(".ln.acesa");
  if (primeira && window.innerWidth < 1000) {
    const r = primeira.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 80) primeira.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

palco.addEventListener("click", (ev) => {
  const t = ev.target;
  if (t.closest("#btnIniciar")) return ir(1);
  if (t.closest("#btnBaixar")) {
    const blob = new Blob([scriptCompleto()], { type: "application/sql;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "westeros.sql";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return;
  }
  const c = t.closest("[data-copiar]");
  if (c) {
    const tipo = c.dataset.copiar;
    if (tipo === "mermaid") return copiar(MERMAID_DER);
    if (tipo === "tudo") return copiar(scriptCompleto());
    return copiar(PASSOS[atual - 1].sql);
  }
  const li = t.closest(".parte");
  if (li) destacar(li);
});
palco.addEventListener("keydown", (ev) => {
  const li = ev.target.closest && ev.target.closest(".parte");
  if (li && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); destacar(li); }
});

document.getElementById("btnAnt").addEventListener("click", () => ir(atual - 1));
document.getElementById("btnProx").addEventListener("click", () => ir(atual + 1));
document.addEventListener("keydown", (ev) => {
  if (dlg.open || ev.target.closest("input, textarea")) return;
  if (ev.key === "ArrowRight") ir(atual + 1);
  else if (ev.key === "ArrowLeft") ir(atual - 1);
});
window.addEventListener("hashchange", () => { const n = lerHash(); if (n !== atual) ir(n); });

// Índice
const dlg = document.getElementById("dlg");
function montarIndice() {
  const itens = [["0", "Início", "O problema e o DER", 0]]
    .concat(PASSOS.map((p, k) => [String(k + 1), p.titulo, `${p.fase} · ${p.rotulo}`, k + 1]))
    .concat([["✓", "Script completo", "Baixar e copiar", TOTAL + 1]]);
  document.getElementById("listaPassos").innerHTML = itens.map(([n, t, f, alvo]) =>
    `<li><button type="button" data-ir="${alvo}" ${alvo === atual ? 'aria-current="step"' : ""}>
       <span class="n">${n}</span><span class="t">${esc(t)}<span class="f">${esc(f)}</span></span></button></li>`).join("");
}
document.getElementById("btnIndice").addEventListener("click", () => { montarIndice(); dlg.showModal(); });
document.getElementById("dlgFechar").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-ir]");
  if (b) { dlg.close(); ir(Number(b.dataset.ir)); }
  else if (ev.target === dlg) dlg.close();
});

if (window.mermaid) {
  mermaid.initialize({
    startOnLoad: false,
    theme: "base",
    fontFamily: "Inter, system-ui, sans-serif",
    themeVariables: {
      primaryColor: "#F3ECDF",
      primaryTextColor: "#241B2E",
      mainBkg: "#F3ECDF",
      edgeLabelBackground: "#FAF6EC",
      tertiaryColor: "#FAF6EC",
      primaryBorderColor: "#3B2350",
      lineColor: "#3B2350",
      textColor: "#241B2E",
      attributeBackgroundColorOdd: "#FAF6EC",
      attributeBackgroundColorEven: "#F3ECDF",
      fontSize: "14px",
    },
    er: { useMaxWidth: true, layoutDirection: "TB" },
  });
}

ir(lerHash(), { foco: false });
</script>
</body>
</html>
